<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Form</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px;
      }

      .container {
        max-width: 600px;
        margin: 0 auto;
        background: white;
        border-radius: 10px;
        padding: 30px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      }

      h1 {
        color: #667eea;
        margin-bottom: 30px;
        text-align: center;
      }

      .form-group {
        margin-bottom: 20px;
      }

      label {
        display: block;
        margin-bottom: 5px;
        color: #333;
        font-weight: 500;
      }

      input,
      select,
      textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 5px;
        font-size: 14px;
      }

      textarea {
        resize: vertical;
        min-height: 100px;
      }

      .btn {
        padding: 12px 30px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        text-decoration: none;
        display: inline-block;
        margin-right: 10px;
        transition: all 0.3s;
      }

      .btn-primary {
        background-color: #667eea;
        color: white;
      }

      .btn-primary:hover {
        background-color: #5568d3;
      }

      .btn-secondary {
        background-color: #6c757d;
        color: white;
      }

      .btn-secondary:hover {
        background-color: #5a6268;
      }

      .button-group {
        margin-top: 30px;
        display: flex;
        justify-content: center;
      }

      .error {
        border-color: red !important;
        border-width: 2px;
      }

      .error-message {
        color: red;
        font-size: 12px;
        margin-top: 5px;
        display: block;
      }

      .required {
        color: red;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1
        th:text="${product.id != null} ? '✏️ Edit Product' : '➕ Add New Product'"
      >
        Product Form
      </h1>

      <form
        th:action="@{/products/save}"
        th:object="${product}"
        method="post"
        enctype="multipart/form-data"
      >
        <!-- Hidden ID field for updates -->
        <input type="hidden" th:field="*{id}" />
        <input type="hidden" th:field="*{imagePath}" />

        <div class="form-group">
          <label for="productCode"
            >Product Code <span class="required">*</span></label
          >
          <input
            type="text"
            id="productCode"
            th:field="*{productCode}"
            th:errorclass="error"
            placeholder="Enter product code (e.g., P001)"
          />
          <span
            th:if="${#fields.hasErrors('productCode')}"
            th:errors="*{productCode}"
            class="error-message"
            >Error</span
          >
        </div>

        <div class="form-group">
          <label for="name">Product Name <span class="required">*</span></label>
          <input
            type="text"
            id="name"
            th:field="*{name}"
            th:errorclass="error"
            placeholder="Enter product name"
          />
          <span
            th:if="${#fields.hasErrors('name')}"
            th:errors="*{name}"
            class="error-message"
            >Error</span
          >
        </div>

        <div class="form-group">
          <label for="price">Price ($) <span class="required">*</span></label>
          <input
            type="number"
            id="price"
            th:field="*{price}"
            th:errorclass="error"
            step="0.01"
            placeholder="0.00"
          />
          <span
            th:if="${#fields.hasErrors('price')}"
            th:errors="*{price}"
            class="error-message"
            >Error</span
          >
        </div>

        <div class="form-group">
          <label for="quantity">Quantity <span class="required">*</span></label>
          <input
            type="number"
            id="quantity"
            th:field="*{quantity}"
            th:errorclass="error"
            placeholder="0"
          />
          <span
            th:if="${#fields.hasErrors('quantity')}"
            th:errors="*{quantity}"
            class="error-message"
            >Error</span
          >
        </div>

        <div class="form-group">
          <label for="category">Category <span class="required">*</span></label>
          <select id="category" th:field="*{category}" th:errorclass="error">
            <option value="">Select category</option>
            <option value="Electronics">Electronics</option>
            <option value="Furniture">Furniture</option>
            <option value="Clothing">Clothing</option>
            <option value="Books">Books</option>
            <option value="Food">Food</option>
            <option value="Other">Other</option>
          </select>
          <span
            th:if="${#fields.hasErrors('category')}"
            th:errors="*{category}"
            class="error-message"
            >Error</span
          >
        </div>

        <div class="form-group">
          <label for="description">Description</label>
          <textarea
            id="description"
            th:field="*{description}"
            placeholder="Enter product description (optional)"
          ></textarea>
        </div>

        <div class="form-group">
          <label for="imageFile">Product Image</label>
          <input
            type="file"
            id="imageFile"
            name="imageFile"
            accept="image/*"
            onchange="previewImage(event)"
          />
          <div th:if="${product.imagePath != null}" style="margin-top: 10px">
            <p style="color: #666; font-size: 12px">Current image:</p>
            <img
              th:src="${product.imagePath}"
              alt="Product image"
              style="
                max-width: 200px;
                border-radius: 5px;
                border: 1px solid #ddd;
              "
              id="currentImage"
            />
          </div>
          <div id="imagePreview" style="margin-top: 10px; display: none">
            <p style="color: #666; font-size: 12px">New image preview:</p>
            <img
              id="preview"
              alt="Preview"
              style="
                max-width: 200px;
                border-radius: 5px;
                border: 1px solid #ddd;
              "
            />
          </div>
        </div>

        <div class="button-group">
          <button type="submit" class="btn btn-primary">💾 Save Product</button>
          <a th:href="@{/products}" class="btn btn-secondary">❌ Cancel</a>
        </div>
      </form>

      <script>
        function previewImage(event) {
          const preview = document.getElementById("preview");
          const previewDiv = document.getElementById("imagePreview");
          const file = event.target.files[0];

          if (file) {
            const reader = new FileReader();
            reader.onload = function (e) {
              preview.src = e.target.result;
              previewDiv.style.display = "block";
            };
            reader.readAsDataURL(file);
          } else {
            previewDiv.style.display = "none";
          }
        }
      </script>
    </div>
  </body>
</html>
